apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: drop-dangerous-capabilities
  annotations:
    policies.kyverno.io/title: Drop Dangerous Capabilities
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must drop dangerous Linux capabilities to reduce
      the privileges available to compromised workloads.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must drop all Linux capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL